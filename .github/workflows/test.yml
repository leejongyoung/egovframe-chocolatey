name: Chocolatey Package Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Chocolatey에 패키지를 배포하시겠습니까?'
        required: true
        default: false
        type: boolean

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      ChocolateyToolsLocation: C:\tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build package
        run: choco pack

      - name: Install package from local source
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          choco install egovframe --source="'.;https://community.chocolatey.org/api/v2/'" --force -y --verbose
          $exitCode = $LASTEXITCODE
          $stopwatch.Stop()
          # The Chocolatey package verifier limits install to 20 minutes.
          $minutes = [math]::Round($stopwatch.Elapsed.TotalMinutes, 1)
          if ($exitCode -ne 0) { throw "choco install failed with exit code $exitCode after $minutes minutes" }
          Write-Host "Install took $minutes minutes"
          "Install took $minutes minutes (Chocolatey verifier limit: 20 minutes)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
        shell: pwsh

      - name: Verify installation directory
        run: |
          $root = Join-Path $env:ChocolateyToolsLocation "eGovFrame"
          foreach ($name in "eclipse", "notice", "workspace-egov") {
            if (-not (Test-Path (Join-Path $root $name))) {
              Write-Error "$name not found under $root"
              exit 1
            }
          }
          if (Test-Path (Join-Path $root ".staging")) {
            Write-Error "Staging folder was not cleaned up"
            exit 1
          }
          Get-ChildItem $root | Select-Object Name
        shell: pwsh

      - name: Verify Eclipse executable
        run: |
          $exe = Join-Path $env:ChocolateyToolsLocation "eGovFrame\eclipse\eclipse.exe"
          if (Test-Path $exe) {
            Write-Host "eclipse.exe found"
          } else {
            Write-Error "eclipse.exe not found"
            exit 1
          }
        shell: pwsh

      - name: Verify workspace path preselected in launcher
        run: |
          $root = Join-Path $env:ChocolateyToolsLocation "eGovFrame"
          $prefs = Get-Content (Join-Path $root "eclipse\configuration\.settings\org.eclipse.ui.ide.prefs")
          $recent = $prefs | Where-Object { $_ -like "RECENT_WORKSPACES=*" }
          Write-Host $recent
          $expected = "RECENT_WORKSPACES=" + ((Join-Path $root "workspace-egov") -replace '\\', '\\' -replace ':', '\:')
          if ($recent -ne $expected) {
            Write-Error "Expected '$expected'"
            exit 1
          }
        shell: pwsh

      - name: Verify desktop shortcut
        run: |
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) "eGovFrame.lnk"
          if (Test-Path $shortcut) {
            Write-Host "Desktop shortcut created"
          } else {
            Write-Warning "Desktop shortcut not found (may not be available in CI)"
          }
        shell: pwsh

      - name: Verify package is listed
        run: choco list | Select-String "egovframe"

      - name: Add a project marker to the workspace
        run: |
          $marker = Join-Path $env:ChocolateyToolsLocation "eGovFrame\workspace-egov\user-project-marker.txt"
          Set-Content -Path $marker -Value "user data"
        shell: pwsh

      - name: Reinstall package (upgrade path)
        run: |
          choco install egovframe --source="'.;https://community.chocolatey.org/api/v2/'" --force -y
          if ($LASTEXITCODE -ne 0) { throw "choco install failed with exit code $LASTEXITCODE" }
        shell: pwsh

      - name: Verify workspace survived reinstall
        run: |
          $root = Join-Path $env:ChocolateyToolsLocation "eGovFrame"
          if (-not (Test-Path (Join-Path $root "workspace-egov\user-project-marker.txt"))) {
            Write-Error "Workspace content was lost on reinstall"
            exit 1
          }
          if (-not (Test-Path (Join-Path $root "eclipse\eclipse.exe"))) {
            Write-Error "eclipse.exe missing after reinstall"
            exit 1
          }
        shell: pwsh

      - name: Test uninstall
        run: |
          choco uninstall egovframe -y
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed with exit code $LASTEXITCODE" }
        shell: pwsh

      - name: Verify uninstall cleanup
        run: |
          $root = Join-Path $env:ChocolateyToolsLocation "eGovFrame"
          foreach ($name in "eclipse", "notice", ".staging") {
            if (Test-Path (Join-Path $root $name)) {
              Write-Error "$name still exists after uninstall"
              exit 1
            }
          }
          if (-not (Test-Path (Join-Path $root "workspace-egov\user-project-marker.txt"))) {
            Write-Error "User workspace must be kept on uninstall"
            exit 1
          }
          Write-Host "Uninstall removed the program and kept the workspace"
        shell: pwsh

  deploy:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build package
        run: choco pack

      - name: Push package to Chocolatey
        run: |
          $nupkg = Get-ChildItem *.nupkg | Select-Object -First 1
          if ($null -eq $nupkg) {
              Write-Error "Generated .nupkg file not found"
              exit 1
          }
          choco push $nupkg.FullName --api-key ${{ secrets.CHOCOLATEY_API_KEY }} --source https://push.chocolatey.org/
        shell: pwsh
